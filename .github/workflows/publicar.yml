# ============================================================================
# Publica o site da AMMA Creative no GitHub Pages.
#
# Corre sempre que algo muda em `main` — incluindo o que a cliente grava no
# painel (backoffice.ammacreative.pt) — e também à mão, pelo botão «Run
# workflow» ou pelo «Publicar outra vez» do painel.
#
# Nota: em Settings → Pages, a origem tem de estar em «GitHub Actions». Se ficar
# na opção antiga, o GitHub tenta processar o repositório com Jekyll e publica o
# código-fonte em vez do site gerado.
# ============================================================================
name: Publicar site

on:
  # EM TODOS OS PUSHES, sem `paths-ignore` (saiu a 4 out 2026). O painel lê a
  # corrida do commit de cada gravação para dizer «Publicado ✓», e um commit
  # sem corrida (um README) ficava a ser o «publicável» sem nunca correr: o
  # «Publicar outra vez» desaparecia. Uma corrida a mais num README custa dois
  # minutos; uma Publicação que mente custa mais.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      payload:
        # Era o Pages CMS (o backoffice até 4 out 2026) que o enviava ao
        # disparar; sem ele declarado, o GitHub recusava o dispatch com
        # «unexpected input». Fica, opcional: o painel não o manda.
        description: 'Contexto do antigo backoffice — deixar vazio'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação de cada vez. Se a cliente gravar três artigos seguidos, só o
# último build interessa — os anteriores são cancelados em vez de ficarem em fila.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Instalar o Pillow
        run: pip install --quiet Pillow

      # A GUARDA DO CONTEÚDO (.github/guardas.mjs, com as regras de
      # .github/regras.mjs — as mesmas do painel em backoffice.ammacreative.pt).
      # Pára só no que não se publica sem partir o site ou a lei (a estrutura
      # dos ficheiros, a morada da sede, o WhatsApp). Um artigo com problemas
      # sai do site SÓ na cópia que o gerador lê (sem nome, sem texto, numa
      # categoria que não existe…), e as fotografias que não são da biblioteca
      # ou que já não existem saem da lista dele: um artigo nunca pára a
      # publicação dos outros. Escreve nos ficheiros de data/ desta corrida,
      # que não faz commit de volta. O resumo fica na página da corrida, e a
      # prova de tudo isto é o .github/test-guardas.mjs (corre em local).
      #
      # CORRE ANTES DE TUDO O QUE LÊ OS DADOS: as fotografias (o cartão de
      # partilha sai da capa de cada artigo) e o gerador lêem a cópia já
      # neutralizada. Substitui o passo que conferia o .pages.yml contra os
      # dados: as categorias vêm do data/categorias.json e as ocasiões das
      # regras, e o painel só oferece essas.
      - name: Conferir o conteúdo
        run: node .github/guardas.mjs --neutralizar . --relatorio-em "$RUNNER_TEMP/relatorio.json"

      # As fotografias que estão na biblioteca são os originais: as do painel
      # chegam reduzidas a 2048 px, as antigas do Pages CMS como saíram do
      # telemóvel (3000 px e vários MB). Aqui geram-se as versões de
      # 480/960/1600 px em WebP que o site serve, e o cartão de partilha de cada
      # artigo. Os originais nunca chegam ao visitante.
      - name: Preparar as fotografias
        run: python3 scripts/otimizar-imagens.py

      - name: Gerar o site
        run: node scripts/gerar.mjs
        env:
          # Desde 4 de Outubro de 2026 o site serve na RAIZ de ammacreative.pt (o
          # domínio está nas definições do Pages e no CNAME): BASE vazio. Antes
          # servia dentro de renatovalente5.github.io/AMMA_Creative, que agora
          # reencaminha para o domínio.
          BASE: ''
          SITE: https://ammacreative.pt

      # Rede de segurança para o erro que parte um site destes em silêncio: se o
      # BASE estiver errado, TUDO o que o HTML pede dá 404 e o site aparece sem
      # estilos. Aqui falha a publicação em vez de ir para o ar assim.
      - name: Confirmar os caminhos
        run: |
          test -f _site/index.html || { echo "falta o index.html"; exit 1; }
          test -f _site/sitemap.xml || { echo "falta o sitemap"; exit 1; }
          grep -q '"/assets/css/estilo.css' _site/index.html \
            || { echo "o HTML nao aponta para o CSS no caminho certo"; exit 1; }
          # CONTAR NAO SERVE AQUI, e por duas vezes ja enganou: contar pastas
          # apanhava as pastas dos enderecos antigos que reencaminham, que estao
          # ao mesmo nivel das fichas; contar os index.html tambem, porque cada
          # reencaminhamento E um index.html. Um dava 32 quando havia 18 artigos,
          # o outro tambem. Por isso nao se conta: verifica-se o caminho exacto
          # de cada artigo publicado, e que o ficheiro la e uma ficha e nao um
          # reencaminhamento.
          python3 - <<'PY'
          import json, glob, os, pathlib, sys
          faltam = []
          for f in sorted(glob.glob('data/produtos/*.json')):
              d = json.load(open(f, encoding='utf-8'))
              if d.get('publicado') is False:
                  continue
              # O endereco vem do NOME DO FICHEIRO, como no gerador. Havia aqui um
              # d['slug'] e rebentou com KeyError no dia em que esse campo saiu dos
              # dados: esta guarda tem de ler a MESMA fonte que o gerador le, senao e
              # uma segunda versao da verdade a envelhecer sozinha.
              slug = os.path.basename(f)[:-5]
              alvo = pathlib.Path('_site/catalogo') / d['categoria'] / slug / 'index.html'
              if not alvo.exists():
                  faltam.append(f"{slug}: nao foi gerada ({alvo})")
              elif 'http-equiv="refresh"' in alvo.read_text(encoding='utf-8'):
                  faltam.append(f"{slug}: onde devia estar a ficha esta um reencaminhamento")
          if faltam:
              print('FICHAS DE ARTIGO EM FALTA:'); [print(' ', x) for x in faltam]; sys.exit(1)
          print('todas as fichas de artigo publicadas existem no caminho certo')
          PY
          # Nenhuma imagem referenciada pode faltar: uma imagem partida numa
          # montra é pior do que um erro de build.
          python3 - <<'PY'
          import re, sys, pathlib
          from urllib.parse import unquote
          raiz = pathlib.Path('_site')
          faltam = []
          for h in raiz.rglob('*.html'):
              t = h.read_text(encoding='utf-8')
              for attr in re.findall(r'(?:src|srcset)="([^"]+)"', t):
                  for parte in attr.split(','):
                      u = parte.strip().split(' ')[0]
                      if u.startswith('/') and re.search(r'\.(webp|jpg|png|svg)$', u):
                          # PERCENT-DECODE. Desde que o gerador passou a codificar os
                          # caminhos, uma fotografia com espaco no nome sai como
                          # `1%20-%209-pronta.webp` no HTML e no disco chama-se
                          # `1 - 9-pronta.webp`. Sem descodificar, a guarda dizia que
                          # faltavam 16 imagens que existem — e como o passo de publicar
                          # depende deste, NADA ia ao ar. A cliente carrega fotografias
                          # com o nome que vem do telemovel; e so uma questao de tempo.
                          rel = unquote(u).replace('/AMMA_Creative/', '', 1).lstrip('/')
                          if not (raiz / rel).exists():
                              faltam.append(f'{h.relative_to(raiz)} -> {u}')
          if faltam:
              print('imagens em falta:'); [print(' ', f) for f in faltam[:20]]; sys.exit(1)
          print('todas as imagens referenciadas existem')
          PY

      # AS 43 LIGACOES MORTAS QUE PASSARAM. Em Agosto de 2026 removeram-se as
      # paginas de categoria e ficaram, no HTML gerado, 43 ligacoes para
      # /catalogo/<categoria>/ — nas migalhas de pao das 18 fichas, no botao do
      # fim de cada ficha e nos cartoes da pagina inicial. Nada no CI as viu: as
      # verificacoes de cima olham para imagens e para o caminho do CSS, nunca
      # para hrefs. Foram encontradas a mao. Isto e a rede que faltava.
      - name: Confirmar que nao ha ligacoes internas mortas
        run: |
          python3 - <<'PY'
          import re, sys, pathlib, json, collections
          from urllib.parse import unquote
          raiz = pathlib.Path('_site')
          BASE = '/'

          def existe(u):
              """Um endereco interno resolve para um ficheiro no que vai para o ar?"""
              u = unquote(u.split('#')[0].split('?')[0])
              if not u.startswith('/'):
                  return True                      # relativo: nao se usa aqui
              rel = u[len(BASE):] if u.startswith(BASE) else u.lstrip('/')
              if rel == '' or rel.endswith('/'):
                  return (raiz / rel / 'index.html').exists()
              alvo = raiz / rel
              return alvo.exists() or (alvo / 'index.html').exists()

          mortas = collections.defaultdict(list)
          for h in sorted(raiz.rglob('*.html')):
              t = h.read_text(encoding='utf-8')
              for u in re.findall(r'href="([^"]+)"', t):
                  if u.startswith(('http://', 'https://', 'mailto:', 'tel:', '#', 'data:')):
                      continue
                  if not existe(u):
                      mortas[u].append(str(h.relative_to(raiz)))

          # O sitemap nao pode anunciar paginas que nao existem: e um convite a
          # erros de rastreio na Search Console.
          sm = (raiz / 'sitemap.xml').read_text(encoding='utf-8')
          fora = [l for l in re.findall(r'<loc>([^<]+)</loc>', sm)
                  if not existe(re.sub(r'^https?://[^/]+', '', l))]

          # O og:image E A IMAGEM QUE O WHATSAPP MOSTRA, e para esta loja o WhatsApp

          # e o canal principal. Nao era verificado por ninguem: a guarda das imagens

          # so olha para `src` e `srcset`, e o og:image e um `<meta content=>`. Um

          # artigo criado pelo backoffice ficou com o og:image a apontar para um

          # ficheiro que nunca chegou a ser escrito, e ninguem deu por isso.

          og_maus = []

          for h in sorted(raiz.rglob('*.html')):

              t = h.read_text(encoding='utf-8')

              for u in re.findall(r'property="og:image" content="([^"]+)"', t):

                  if not existe(re.sub(r'^https?://[^/]+', '', u)):

                      og_maus.append(f'{h.relative_to(raiz)} -> {u}')

          

          # O `item` e obrigatorio em todos os ListItem de um BreadcrumbList
          # excepto o ultimo. Faltar um da «Missing field item» na Search Console.
          migalhas_ma = []
          for h in sorted(raiz.rglob('*.html')):
              for bloco in re.findall(r'<script type="application/ld\+json">(.*?)</script>',
                                      h.read_text(encoding='utf-8'), re.S):
                  try:
                      dados = json.loads(bloco)
                  except json.JSONDecodeError as e:
                      migalhas_ma.append(f'{h.relative_to(raiz)}: JSON-LD invalido ({e})'); continue
                  for d in (dados if isinstance(dados, list) else [dados]):
                      if isinstance(d, dict) and d.get('@type') == 'BreadcrumbList':
                          itens = d.get('itemListElement', [])
                          for i in itens[:-1]:
                              if 'item' not in i:
                                  migalhas_ma.append(
                                      f"{h.relative_to(raiz)}: degrau {i.get('position')} "
                                      f"«{i.get('name')}» sem `item`")

          mal = False
          if mortas:
              mal = True
              print(f'LIGACOES INTERNAS MORTAS: {len(mortas)} endereco(s)')
              for u, paginas in sorted(mortas.items())[:20]:
                  print(f'  {u}  <- {len(paginas)} pagina(s), ex.: {paginas[0]}')
          if fora:
              mal = True
              print(f'SITEMAP a anunciar {len(fora)} pagina(s) que nao existem:')
              for l in fora[:20]:
                  print('  ', l)
          if og_maus:
              mal = True
              print(f'og:image que nao existe: {len(og_maus)}')
              for x in og_maus[:20]:
                  print('  ', x)
          if migalhas_ma:
              mal = True
              print(f'MIGALHAS DE PAO invalidas: {len(migalhas_ma)}')
              for m in migalhas_ma[:20]:
                  print('  ', m)
          if mal:
              sys.exit(1)
          print('ligacoes internas, sitemap e migalhas de pao: tudo resolve')
          PY

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
