# ============================================================================
# Publica o site da AMMA Creative no GitHub Pages.
#
# Corre sempre que algo muda em `main` — incluindo o que a cliente grava no
# backoffice — e também à mão, pelo botão «Run workflow».
#
# Nota: em Settings → Pages, a origem tem de estar em «GitHub Actions». Se ficar
# na opção antiga, o GitHub tenta processar o repositório com Jekyll e publica o
# código-fonte em vez do site gerado.
# ============================================================================
name: Publicar site

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'PLANO.md'
      - '_fonte/**'
  workflow_dispatch:
    inputs:
      payload:
        # O Pages CMS envia sempre este input ao disparar do backoffice. Se não
        # estiver declarado, o GitHub recusa o dispatch com «unexpected input».
        description: 'Contexto do Pages CMS — deixar vazio se disparar à mão'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação de cada vez. Se a cliente gravar três artigos seguidos, só o
# último build interessa — os anteriores são cancelados em vez de ficarem em fila.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Instalar o Pillow e o PyYAML
        run: pip install --quiet Pillow PyYAML

      # O Pages CMS grava a fotografia exactamente como saiu do telemóvel — 3000
      # px e vários MB. Aqui geram-se as versões de 480/960/1600 px em WebP que o
      # site serve, e o cartão de partilha de cada artigo. Os originais nunca
      # chegam ao visitante.
      - name: Preparar as fotografias
        run: python3 scripts/otimizar-imagens.py

      # O backoffice pode partir sem o SITE dar sinal. As opções de «categoria» e
      # «ocasiões» vivem no .pages.yml, e os valores gravados vivem nos JSON dos
      # artigos: se as duas listas se desencontrarem, o site gera-se
      # perfeitamente e é a cliente que descobre, ao abrir um artigo e encontrar
      # um campo OBRIGATÓRIO em branco, sem saber o que lá estava.
      #
      # Aconteceu: uma linha de remoção apanhou a lista errada — «Lembranças»
      # existe como categoria E como ocasião, com texto idêntico — e tirou a
      # categoria a dois artigos que a usavam. Nenhuma verificação de então
      # apanhava isto, porque nenhuma olhava para o backoffice.
      - name: Confirmar o backoffice contra os dados
        run: |
          python3 - <<'PY'
          import yaml, json, glob, sys
          y = yaml.safe_load(open('.pages.yml', encoding='utf-8'))
          art = [c for c in y['content'] if c['name'] == 'artigos'][0]
          opc = {f['name']: {o['name'] for o in f['options']['values']}
                 for f in art['fields'] if f['name'] in ('categoria', 'ocasioes')}
          erros = []
          usadas = {'categoria': set(), 'ocasioes': set()}
          for f in sorted(glob.glob('data/produtos/*.json')):
              d = json.load(open(f, encoding='utf-8'))
              usadas['categoria'].add(d['categoria'])
              usadas['ocasioes'] |= set(d.get('ocasioes') or [])
              if d['categoria'] not in opc['categoria']:
                  erros.append(f"{d['slug']}: categoria \"{d['categoria']}\" nao esta nas opcoes do .pages.yml")
              for o in d.get('ocasioes') or []:
                  if o not in opc['ocasioes']:
                      erros.append(f"{d['slug']}: ocasiao \"{o}\" nao esta nas opcoes do .pages.yml")
          # As categorias tambem tem de existir em categorias.json, senao o
          # gerador escreve um endereco sem pagina de categoria.
          cats = {c['slug'] for c in json.load(open('data/categorias.json', encoding='utf-8'))}
          for c in opc['categoria'] - cats:
              erros.append(f"categoria \"{c}\" esta no .pages.yml mas nao em categorias.json")
          for c in cats - opc['categoria']:
              erros.append(f"categoria \"{c}\" esta em categorias.json mas nao no .pages.yml")
          if erros:
              print('backoffice desencontrado dos dados:')
              [print(' ', e) for e in erros]
              sys.exit(1)
          orfas = (opc['categoria'] - usadas['categoria']) | (opc['ocasioes'] - usadas['ocasioes'])
          if orfas:
              print('aviso: opcoes sem nenhum artigo (nao e erro):', ', '.join(sorted(orfas)))
          print('backoffice e dados coerentes')
          PY

      - name: Gerar o site
        run: node scripts/gerar.mjs
        env:
          # Sem domínio próprio, o site serve dentro de /AMMA_Creative. Quando o
          # domínio existir, BASE passa a vazio e SITE ao endereço novo — e o
          # CNAME entra no repositório.
          BASE: /AMMA_Creative
          SITE: https://renatovalente5.github.io/AMMA_Creative

      # Rede de segurança para o erro que parte um site destes em silêncio: se o
      # BASE estiver errado, TUDO o que o HTML pede dá 404 e o site aparece sem
      # estilos. Aqui falha a publicação em vez de ir para o ar assim.
      - name: Confirmar os caminhos
        run: |
          test -f _site/index.html || { echo "falta o index.html"; exit 1; }
          test -f _site/sitemap.xml || { echo "falta o sitemap"; exit 1; }
          grep -q '"/AMMA_Creative/assets/css/estilo.css' _site/index.html \
            || { echo "o HTML nao aponta para o CSS no caminho certo"; exit 1; }
          n=$(find _site/catalogo -mindepth 2 -maxdepth 2 -type d | wc -l)
          echo "paginas de produto geradas: $n"
          test "$n" -gt 0 || { echo "nenhum produto gerado"; exit 1; }
          # Nenhuma imagem referenciada pode faltar: uma imagem partida numa
          # montra é pior do que um erro de build.
          python3 - <<'PY'
          import re, sys, pathlib
          raiz = pathlib.Path('_site')
          faltam = []
          for h in raiz.rglob('*.html'):
              t = h.read_text(encoding='utf-8')
              for attr in re.findall(r'(?:src|srcset)="([^"]+)"', t):
                  for parte in attr.split(','):
                      u = parte.strip().split(' ')[0]
                      if u.startswith('/') and re.search(r'\.(webp|jpg|png|svg)$', u):
                          rel = u.replace('/AMMA_Creative/', '', 1).lstrip('/')
                          if not (raiz / rel).exists():
                              faltam.append(f'{h.relative_to(raiz)} -> {u}')
          if faltam:
              print('imagens em falta:'); [print(' ', f) for f in faltam[:20]]; sys.exit(1)
          print('todas as imagens referenciadas existem')
          PY

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
