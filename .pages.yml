# ============================================================================
# Backoffice da AMMA Creative — configuração do Pages CMS (pagescms.org)
#
# A cliente entra em app.pagescms.org com um link enviado por email. Não precisa
# de conta no GitHub e não consegue mexer neste ficheiro — só no conteúdo.
#
# Cada gravação é guardada no repositório e o site é publicado sozinho em 1 a 3
# minutos.
#
# DUAS COISAS SÓ, na barra lateral: Artigos e Dados da loja. Foi pedido um
# backoffice simples, e simples aqui quer dizer poucas entradas com ajuda em cada
# campo — não muitas entradas bem arrumadas. Eram três até a entrada das
# categorias sair, quando a coluna das categorias saiu do rodapé.
# ============================================================================
# A página «Settings» do Pages CMS mostra ESTE ficheiro e deixa editá-lo. Não é
# sítio para a dona da loja entrar: o cabeçalho aqui em cima promete duas coisas
# na barra lateral e sem isto seriam três.
#
# `content.merge` guarda as chaves que este ficheiro não declara. É preciso:
# data/definicoes.json tem um bloco `tecnico` que não está declarado abaixo, e
# sem isto a primeira gravação de «Dados da loja» apagava-o em silêncio.
settings:
  hide: true
  content:
    merge: true

actions:
  - name: publicar
    label: Publicar site agora
    workflow: publicar.yml
    ref: current
    confirm:
      title: Publicar o site?
      message: >-
        O site vai ser reconstruído com as alterações já gravadas. Demora 1 a 3
        minutos. Normalmente não é preciso — cada gravação já publica sozinha.
        Use isto se achar que ficou algo por actualizar.
      button: Publicar

# `output` igual a `input` de propósito. Com a barra inicial (`/assets/...`) o
# Pages CMS grava os caminhos das fotografias numa forma diferente da que está
# nos ficheiros, e a primeira gravação de cada artigo reescrevia a lista toda.
media:
  input: assets/produtos
  output: assets/produtos
  # `extensions` em vez de `categories: [image]`: a categoria `image` do Pages CMS
  # são doze extensões (svg, ico, bmp, tif, apng, avif…) e é essa lista inteira que
  # aparece na mensagem de recusa, «Invalid file type. Allowed: …», que fica
  # ilegível. Com quatro, a mensagem diz algo. Nota: as duas chaves NÃO se somam —
  # se coexistirem, `categories` é apagada em silêncio e `extensions` ganha.
  extensions: [jpg, jpeg, png, webp]

content:
  # ---------------------------------------------------------------- artigos
  - name: artigos
    label: Artigos
    type: collection
    path: data/produtos
    filename: '{fields.slug}.json'
    format: json
    # SEM APAGAR e SEM RENOMEAR. Apagar um artigo daqui parte os links que já
    # andam partilhados, e o histórico de endereços vive na lista REENCAMINHAR do
    # gerador, fora do alcance do backoffice. O caminho para tirar um artigo do
    # site é desligar «Publicado no site», que não perde nada e se desfaz com um
    # clique. Renomear mexeria no nome do ficheiro, que é o endereço.
    operations:
      create: true
      rename: false
      delete: false
    view:
      # O `slug` na tabela é a referência do artigo: é o que está no endereço da
      # página e o nome do próprio ficheiro. Serve para o distinguir sem
      # ambiguidade quando há nomes parecidos — e há: quatro bodies de convite.
      fields: [nome, categoria, publicado, slug]
      primary: nome
      sort: [ordem, nome]
      # A CAIXA DE PROCURA é a alteração com melhor retorno deste ficheiro. A
      # primeira coisa que se faz aqui é encontrar o artigo das fotografias que
      # acabaram de chegar, e vinte linhas percorridas com o olho é como seis
      # fotografias foram para o artigo errado.
      search: [nome, resumo, slug]
      default:
        sort: ordem
        order: asc
    fields:
      # ORDEM DOS CAMPOS, e é deliberada: primeiro o que ela vem cá fazer.
      # Antes era nome, categoria, ocasiões, fotografias — ou seja, os dois campos
      # que ela NÃO manda (as duas listas são fixas) vinham antes daquele que a
      # traz aqui. Agora abre com o nome, as fotografias e os textos; as escolhas
      # de arrumação vêm depois; e as opções de publicação ficam no fim, com o
      # endereço em último por ser o único campo técnico e o único a não tocar.
      - name: nome
        label: Nome do artigo
        type: string
        required: true
        description: >-
          Como aparece no site e no Google. Escreva-o como o descreveria a uma
          cliente — «Body «aceitas ser a minha madrinha?»» diz mais do que
          «Body 03».

      - name: fotos
        label: 'Fotografias — a primeira é a da capa'
        type: image
        options:
          multiple:
            # 16 e não 12: estes artigos não têm 3 vistas de uma peça, têm uma
            # fotografia por FRASE — o do pai tem 8, o do anúncio de gravidez
            # passou de 7 para 14. A tira de miniaturas rola na horizontal, por
            # isso o número não parte a página.
            max: 16
        description: >-
          CADA FOTOGRAFIA TEM DE ESTAR ABAIXO DE 3 MB. Acima disso o carregamento
          falha com a mensagem «Failed to upload file: 413», que não explica nada — e
          as fotografias tiradas com telemóvel passam muitas vezes desse tamanho. Para
          saber quanto pesa cada uma, e para reduzir as que são grandes, abra esta
          página: renatovalente5.github.io/AMMA_Creative/reduzir-fotos/ — arraste as
          fotografias para lá, ela diz-lhe o que se passa com cada uma e devolve
          reduzidas as que não passam. Não instala nada e as fotografias não saem do
          seu computador. Se preferir, mande-as por WhatsApp que nós carregamos.
          •
          As fotografias em HEIC, o formato do iPhone, também não são aceites: no
          telemóvel, em Definições, Câmara, Formatos, escolha «Mais compatível» e as
          próximas saem em JPG.
          •
          Estas fotografias são as DESTE artigo — antes de carregar, confirme em cima
          que o nome é o do artigo certo, que é o engano mais fácil de fazer. A
          PRIMEIRA da lista é a da capa: é a que aparece no catálogo, na página
          inicial e na pré-visualização quando o link é partilhado no WhatsApp;
          escolha uma em que se veja bem a peça inteira. Arraste para trocar a ordem.
          O tamanho da imagem no site é tratado sozinho na publicação — o limite dos
          3 MB é só para o carregamento aqui.

      # ─────────── textos
      - name: resumo
        label: 'Frase curta do catálogo'
        type: text
        required: true
        description: >-
          Uma ou duas frases, não mais. Aparece no cartão do catálogo e é o que o
          Google mostra na pesquisa. Diga o que a peça é e para quem serve, sem
          repetir o nome. NÃO é o mesmo que o texto da página, que vem a seguir: se
          puser aqui o texto todo, o cartão do catálogo fica com um parágrafo onde
          devia ter uma linha.

      - name: texto
        label: 'Texto da página do artigo'
        type: text
        required: true
        description: >-
          Dois ou três parágrafos, na primeira pessoa, como se estivesse a explicar
          a uma cliente. Deixe uma linha em branco entre parágrafos, que no site
          aparecem separados. O que resulta melhor: dizer o que a peça tem de
          especial, o que as pessoas costumam escolher, e uma frase sobre o
          material. Este texto aparece só na página do artigo — a frase curta que
          aparece no catálogo é a de cima.

      - name: personalizavel
        label: O que se personaliza
        type: string
        list: true
        description: >-
          Um item por linha, curto. Exemplo: «O nome do bebé», «A cor do
          lettering», «O tamanho do body». Aparece em lista com um visto ao lado
          de cada um — é dos blocos que as clientes mais leem, porque é onde
          percebem que podem pedir o que querem.

      - name: preco
        label: 'Preço (€) — vazio fica «Sob consulta»'
        type: number
        step: 0.5
        description: >-
          DEIXE VAZIO para o artigo ficar «Sob consulta», que é como está a maioria.
          Se puser um valor, ele aparece no catálogo e na ficha do artigo, e tem de
          ser o preço final que a cliente paga, com todos os impostos incluídos — é
          o que a lei obriga. Os portes são à parte e o site di-lo por si. Se o
          preço depender do que a pessoa escolher personalizar, é melhor deixar
          vazio do que pôr um valor que depois muda.

      # ─────────── publicação
      - name: categoria
        label: 'Categoria — onde aparece no catálogo'
        type: select
        required: true
        description: >-
          Onde o artigo aparece no catálogo e no menu do fim da página. Cada artigo
          tem uma só. Atenção: a categoria faz parte do link do artigo, por isso
          mudá-la aqui muda o link, e quem tiver o antigo deixa de o abrir — pode
          mudar-se, diga-nos e nós deixamos o antigo a levar ao novo. Esta lista tem
          as categorias do site. Para acrescentar outra, fale connosco
          primeiro: são duas coisas que têm de entrar ao mesmo tempo e é por isso
          que se pede. É o único sítio deste backoffice onde precisa de nós — e fica
          no mesmo dia.
        # A chave de cada opção é `name`, não `value` — está assim documentado, e
        # com `value` arrisca-se gravar vazio sem aviso nenhum.
        options:
          values:
            - { name: bodies, label: 'Bodies' }
            - { name: aco, label: 'Artigos em aço' }
            - { name: boxes, label: 'Boxes de presente' }
            - { name: textil, label: 'Têxtil personalizado' }
            - { name: lembrancas, label: 'Lembranças' }

      - name: ocasioes
        label: 'Ocasiões — os filtros do catálogo'
        type: select
        list: true
        description: >-
          Para que ocasiões serve o artigo. É por aqui que se filtra o catálogo:
          quem procura um presente de batizado escolhe «Batizado» e vê só o que
          serve. Pode escolher várias, e pode não escolher nenhuma — o artigo
          continua no catálogo. Uma ocasião só aparece como botão de filtro se tiver
          artigos. Para acrescentar uma ocasião nova à lista, fale connosco, como
          nas categorias: fica no mesmo dia.
        # DUAS OCASIÕES FORAM RETIRADAS, em Agosto de 2026, e por medição:
        # «Páscoa» tinha UM artigo, e esse artigo passou a chamar-se «o meu
        # primeiro…» — cobre a Páscoa, o Natal e o aniversário, portanto a
        # etiqueta prendia-o a um terço do que é. «Lembranças» devolvia
        # exactamente os MESMOS dois artigos da categoria com o mesmo nome: eram
        # duas pastilhas com a mesma palavra na mesma página a fazer o mesmo.
        # Uma ocasião só serve se separar o catálogo em dois grupos com gente
        # dos dois lados.
        options:
          multiple: true
          values:
            - { name: anuncio-gravidez, label: 'Anúncio de gravidez' }
            - { name: convite-padrinhos, label: 'Convite a padrinhos' }
            # A CHAVE fica «baptizado» de propósito: é o valor gravado nos
            # artigos e o que vai no endereço partilhável
            # (?ocasiao=baptizado). Mudá-la obrigava a reescrever seis
            # artigos e partia os links que já andam por aí. O que se vê é
            # o `label`.
            - { name: baptizado, label: 'Batizado' }
            - { name: casamento, label: 'Casamento' }
            - { name: dia-da-mae, label: 'Dia da Mãe' }
            - { name: dia-do-pai, label: 'Dia do Pai' }
            - { name: presente, label: 'Presente' }

      # ─────────── fotografias
      - name: publicado
        label: 'Publicado no site'
        type: boolean
        default: true
        description: >-
          Desligue para tirar o artigo do site sem o perder: fica aqui guardado e
          volta a aparecer quando ligar outra vez. É assim que se retira um artigo —
          útil enquanto não tem fotografias boas, ou para uma peça que deixou de
          fazer. Não há botão de apagar, e é de propósito: desligar aqui não perde
          nada e não parte os links que já andam partilhados por aí. Se quiser mesmo
          apagar um artigo, diga-nos.

      - name: destaque
        label: 'Mostrar na página inicial'
        type: boolean
        default: false
        description: >-
          Estes são os artigos que aparecem na página inicial, na secção «O que mais
          sai por aqui». A página inicial mostra SEIS no máximo, pela posição na
          lista — se marcar dez, aparecem só os seis primeiros. Se não marcar
          nenhum, aparecem os seis primeiros do catálogo. Quatro a seis é o número
          que fica bem.

      - name: ordem
        label: 'Posição na lista'
        type: number
        default: 500
        description: >-
          Número mais baixo aparece primeiro, no catálogo e na página inicial.
          Deixe 500 se for indiferente: os artigos que ficarem com o mesmo número
          aparecem por ordem alfabética. Para empurrar um artigo para o topo, ponha
          10.
        # Sem `min`: no Pages CMS o `min` passa a ser a base do incremento e
        # invalida valores que já existam nos dados.
        step: 10

      - name: slug
        label: 'Endereço da página — não mudar'
        type: string
        required: true
        description: >-
          É o fim do link do artigo. Depois de o artigo estar publicado, NÃO MUDE:
          quem tiver o link guardado ou partilhado deixa de o conseguir abrir, e o
          Google perde a página. Se precisar mesmo de mudar, diga-nos — nós mudamos
          e deixamos o endereço antigo a levar as pessoas ao novo, como já está
          feito para todos os que mudaram até hoje. Só letras minúsculas, números
          e hífens, sem
          acentos. Exemplo: body-convite-madrinha.
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'

  # ------------------------------------------------------------- categorias
  # A ENTRADA DAS CATEGORIAS SAIU DAQUI, a pedido, quando a coluna das categorias
  # saiu do rodapé. O ficheiro data/categorias.json continua a existir e continua a
  # mandar no rótulo dos filtros do catálogo, nos cartões da prateleira da página
  # inicial e nas migalhas de pão. O que mudou é quem lhe mexe — passa a ser
  # tratado por nós, não pelo backoffice.
  #
  # Depois disto as PÁGINAS de categoria também foram removidas, também a pedido:
  # /catalogo/<categoria>/ deixou de existir e quem escolhe uma categoria vai para
  # o catálogo já filtrado. Por isso os campos `texto`, `titulo_seo` e
  # `descricao_seo` de categorias.json já não aparecem em sítio nenhum do site —
  # ficaram guardados, não apagados, para o caso de essas páginas voltarem.
  #
  # O que a cliente deixa de poder editar sozinha: o nome de uma categoria e o
  # resumo do cartão da página inicial. São textos curtos que raramente mudam;
  # se algum tiver de mudar, é um pedido.
  #
  # Repor isto é apagar este comentário e voltar a pôr o bloco, que está no
  # histórico do git. Nada nos dados precisa de mudar.

  # ---------------------------------------------------------- dados da loja
  - name: definicoes
    label: Dados da loja
    type: file
    path: data/definicoes.json
    format: json
    # Apagar este ficheiro parava a construção do site inteiro.
    operations:
      delete: false
    fields:
      - name: contactos
        label: Contactos
        type: object
        description: >-
          Aparecem no cabeçalho, no rodapé, na página de contactos e nos botões
          de todas as fichas de artigo. Mudar aqui muda em todo o lado.
        fields:
          # O telefone aparece SÓ na página de contactos, por decisão da loja.
          # Não está no rodapé, nem nas fichas de artigo, nem no menu.
          - { name: telefone, label: 'Telefone (só dígitos, sem indicativo)', type: string }
          - name: telefone_texto
            label: 'Telefone (como aparece escrito)'
            type: string
            description: >-
              Com espaços, como se lê: 930 477 114. Aparece na página de
              contactos, sempre acompanhado do aviso do custo da chamada, que o
              site acrescenta sozinho porque a lei obriga.
          - name: whatsapp
            label: WhatsApp
            type: string
            description: 'Com o indicativo e sem sinais: 351930477114.'
          - { name: email, label: Email, type: string }
          - { name: instagram, label: 'Instagram (endereço completo)', type: string }

      - name: local
        label: Onde estão
        type: object
        description: >-
          A morada que aparece no fim de todas as páginas, na página de
          contactos, no mapa e nos dados que o Google lê. A latitude e a
          longitude são o alfinete do mapa: tiram-se do Google Maps, com o
          botão direito sobre o local e «Copiar coordenadas». Se não tiver a
          certeza, não mexa — um número trocado põe o alfinete no mar.
        fields:
          - { name: morada, label: Rua, type: string }
          - { name: codigo_postal, label: Código postal, type: string }
          - { name: localidade, label: Localidade, type: string }
          - { name: concelho, label: Concelho, type: string }
          - { name: pais, label: País, type: string }
          - name: latitude
            label: Latitude
            type: number
            description: 'Para o mapa e para o Google. Sem `step`, o backoffice recusa decimais.'
            step: 0.0000001
          - { name: longitude, label: Longitude, type: number, step: 0.0000001 }
          - { name: mapa, label: Link do Google Maps, type: string }

      - name: textos
        label: Textos do site
        type: object
        description: >-
          As frases grandes. Alterações aqui aparecem na página inicial e no
          «Sobre nós» assim que gravar.
        fields:
          - name: hero_titulo
            label: Título da página inicial
            type: string
            description: >-
              A frase grande, a primeira coisa que se vê no site. Ponha
              *asteriscos* à volta das palavras que quer destacar e elas saem em
              itálico e noutra cor — por exemplo «Feito para *uma pessoa* só».
              Funciona melhor entre 16 e 36 letras: mais do que isso e parte em
              três linhas.
          - { name: hero_texto, label: Texto da página inicial, type: text }
          - { name: reclamo, label: Frase da marca (rodapé), type: string }
          - { name: sobre_titulo, label: Título do «Sobre nós», type: string }
          - { name: sobre_texto, label: Texto do «Sobre nós», type: text }
          - name: portes
            label: Frase dos portes
            type: string
            description: >-
              Aparece na página inicial, nas fichas de artigo e nas perguntas
              frequentes. Exemplo: «Portes grátis acima de 60€».
          - name: prazo
            label: Prazo de produção
            type: string
            description: >-
              Aparece debaixo dos passos, no «Como encomendar» e na página
              inicial. Numa venda à distância é informação obrigatória, por isso
              vale a pena mantê-la preenchida e certa. Exemplo: «Os nossos
              artigos demoram entre 2 e 3 dias úteis a produzir».

      - name: passos
        label: Como encomendar (os passos)
        type: object
        list: true
        description: >-
          Os passos que aparecem na página inicial e no «Como encomendar».
          Numeram-se sozinhos pela ordem em que estiverem aqui — arraste para
          trocar. Pode ter três, quatro ou cinco: as colunas ajustam-se.
        fields:
          - name: titulo
            label: Título do passo
            type: string
            required: true
            description: 'Curto, três ou quatro palavras. Exemplo: «Fale connosco».'
          - name: texto
            label: Explicação
            type: text
            description: Uma ou duas linhas. O que a pessoa tem de fazer nesta fase.

      - name: opcoes
        label: Mapa
        type: object
        fields:
          - name: mostrar_mapa
            label: Mostrar o mapa na página de contactos
            type: boolean
            description: >-
              O mapa só carrega depois de o visitante o autorizar, porque vem do
              Google e instala cookies. Desligue isto se preferir não o ter.

      - name: empresa
        label: Dados legais
        type: object
        description: >-
          Aparecem no rodapé por imposição legal (Decreto-Lei 7/2004): quem tem
          um site com actividade comercial tem de se identificar de forma
          permanente. Altere só se algum destes dados mudar.
        fields:
          - { name: nome_comercial, label: Nome comercial, type: string }
          - { name: assinatura, label: Assinatura (Artigos personalizados), type: string }
          - name: denominacao_social
            label: Nome completo da titular
            type: string
            description: >-
              Numa empresa em nome individual, a denominação é o nome da pessoa.
              É o que a lei obriga a mostrar, e está a faltar — assim que o der,
              substitui-se aqui.
          - { name: forma_juridica, label: Forma jurídica, type: string }
          - name: nif
            label: NIF
            type: string
            description: Obrigatório no rodapé. Está com um valor de espera até ser indicado.
          - { name: cae, label: CAE, type: string }
